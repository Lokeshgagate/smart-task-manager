services:
  - type: web
    name: smart-task-manager-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start

  - type: web
    name: smart-task-manager-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: smart-task-manager-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME